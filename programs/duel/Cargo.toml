[workspace]
members = ["programs/*"]
# MSRV-aware resolution is enabled in .cargo/config.toml (`resolver.incompatible-rust-versions =
# "fallback"`, anchor-cli's manifest parser does not accept `resolver = "3"`). Together with
# `rust-version` in programs/duel/Cargo.toml it keeps transitive dependencies compatible with the
# platform-tools cargo (1.84) used by cargo-build-sbf even though the host toolchain writes Cargo.lock.
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
