[toolchain]
anchor_version = "0.32.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
duel = "AN2TEyFH3zCsv5MENn2uo9LJx69J2EUC8iScAVeDbW25"

[programs.devnet]
duel = "AN2TEyFH3zCsv5MENn2uo9LJx69J2EUC8iScAVeDbW25"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Node is not installed in WSL; run `pnpm test` from Windows against the WSL validator instead.
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/*.ts"

[test]
startup_wait = 10000
